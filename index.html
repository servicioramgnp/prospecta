<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prospecta GAR</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2313233A'/><rect x='12' y='14' width='10' height='36' rx='3' fill='%23EE7623'/><rect x='27' y='14' width='10' height='36' rx='3' fill='%23EE7623'/><rect x='42' y='14' width='10' height='36' rx='3' fill='none' stroke='%23EE7623' stroke-width='3'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --ink:#13233A; --ink-2:#1E3452; --ink-3:#2B4466;
  --paper:#F3F5F8; --surface:#FFFFFF; --surface-2:#F8F9FB;
  --line:#DCE2EA; --line-2:#C7D0DC;
  --text:#13233A; --muted:#5B6B7F;
  --accent:#EE7623; --accent-ink:#B8520D; --accent-soft:#FDEBDD;
  --ok:#23845A; --ok-soft:#DDF2E7;
  --warn:#B97C06; --warn-soft:#FBF0D5;
  --bad:#C0402E; --bad-soft:#F9E1DC;
  --focus:#2F6FEB;
  --radius-s:6px; --radius-m:10px; --radius-l:16px;
  --font:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-w:236px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A2A; --surface:#16243A; --surface-2:#1B2B44;
    --line:#26395A; --line-2:#34507A;
    --text:#E8EDF4; --muted:#9AAAC0;
    --accent:#F4863C; --accent-ink:#FFB27A; --accent-soft:#3A2A1E;
    --ok:#4CC08A; --ok-soft:#173A2C; --warn:#E3AE3A; --warn-soft:#3A3118;
    --bad:#EE7A68; --bad-soft:#3E211E;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.5;color:var(--text);background:var(--paper);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{font-stretch:112%;line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:780}
h2{font-size:1.15rem;font-weight:720}
h3{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Botones y formularios ---------- */
.btn{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--line-2);background:var(--surface);padding:.55rem .95rem;border-radius:var(--radius-s);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:.3rem .6rem;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
label.f{display:flex;flex-direction:column;gap:.3rem;font-size:.85rem;font-weight:600;color:var(--muted)}
label.f span.hint{font-weight:400}
.in, select.in, textarea.in{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--radius-s);padding:.55rem .65rem;font-size:.95rem;color:var(--text);font-weight:400}
textarea.in{resize:vertical;min-height:84px}
.in.pin{letter-spacing:.4em;font-size:1.25rem;font-weight:650;max-width:13rem}
.in:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.in.num{width:4.2rem;text-align:center;padding:.35rem}
.grid-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem}
.grid-form .span2{grid-column:span 2}
.grid-form .span4{grid-column:1/-1}
.form-actions{display:flex;gap:.6rem;justify-content:flex-end;align-items:center;flex-wrap:wrap}

/* ---------- Estructura ---------- */
#app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100%;background:linear-gradient(to right,var(--ink) var(--nav-w),transparent 0)}
.nav{background:var(--ink);color:#DCE5F2;display:flex;flex-direction:column;padding:1.2rem .8rem;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:.65rem;padding:.2rem .5rem 1.4rem}
.brand-mark{display:flex;gap:3px}
.brand-mark i{display:block;width:7px;height:24px;border-radius:2px;background:var(--accent)}
.brand-mark i:last-child{background:transparent;border:2px solid var(--accent)}
.brand b{font-stretch:125%;font-weight:800;font-size:1.05rem;color:#fff;letter-spacing:-.01em}
.brand small{display:block;font-size:.72rem;color:#9FB0C8;font-weight:500;font-stretch:100%}
.nav a.item{display:flex;align-items:center;gap:.7rem;padding:.6rem .7rem;border-radius:var(--radius-s);color:#C9D5E6;text-decoration:none;font-weight:560;margin-bottom:2px}
.nav a.item svg{width:19px;height:19px;flex:none;opacity:.85}
.nav a.item:hover{background:var(--ink-2);color:#fff}
.nav a.item.active{background:var(--ink-3);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav .sep{font-size:.75rem;color:#7F93AF;padding:1rem .7rem .35rem}
.nav .me{margin-top:auto;border-top:1px solid var(--ink-3);padding:.9rem .5rem 0;font-size:.85rem}
.nav .me b{display:block;color:#fff;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .me span{color:#9FB0C8}
.nav .me button{margin-top:.6rem;width:100%;justify-content:center;background:transparent;border-color:var(--ink-3);color:#DCE5F2}
main{padding:1.8rem clamp(1rem,3vw,2.6rem) 4rem;max-width:1280px;width:100%;min-width:0}
.charts>*{min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem}
.page-head .sub{color:var(--muted);margin-top:.35rem;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:1.2rem;margin-bottom:1.2rem}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}
.panel-head p{color:var(--muted);font-size:.9rem}

/* Selector de semana */
.weeknav{display:flex;align-items:center;gap:.35rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:.3rem}
.weeknav .lbl{padding:0 .6rem;font-weight:650;min-width:11.5rem;text-align:center;font-size:.95rem}
.weeknav .lbl small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.weeknav .btn{padding:.4rem .55rem}

/* ---------- El tablero de citas (elemento protagonista) ---------- */
.board{background:var(--ink);color:#fff;border-radius:var(--radius-l);padding:1.4rem 1.5rem 1.2rem;margin-bottom:1.2rem;display:grid;gap:1.3rem}
.tally-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:.65rem}
.tally-head h2{color:#fff;font-size:1.05rem}
.tally-count{font-stretch:118%;font-weight:600;color:#B9C7DA}
.tally-count b{font-size:2.3rem;font-weight:800;color:#fff;margin-right:.3rem;line-height:1}
.slots{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.slot{flex:1 1 0;min-width:26px;max-width:64px;height:54px;border-radius:7px;border:2px solid #3A5578;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:.72rem;color:#6F87A8;font-weight:600;position:relative}
.slot.stretch{border-style:dashed;border-color:#34507A}
.slot.fill{background:var(--accent);border-color:var(--accent);color:#FFE3CF}
.slot.fill.extra{background:#FFB27A;border-color:#FFB27A;color:#6A3208}
.slot.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.slot-mark{align-self:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:.68rem;color:#9FB0C8;padding:0 2px;border-left:2px solid #9FB0C8;height:54px;text-align:center}
.tally-note{margin-top:.55rem;font-size:.9rem;color:#C9D5E6}
.tally-note b{color:#fff}
.tally-note .ok{color:#7FE0AE}.tally-note .warn{color:#FFD27A}.tally-note .bad{color:#FFA595}
.board-foot{display:flex;gap:2rem;flex-wrap:wrap;border-top:1px solid var(--ink-3);padding-top:1rem;font-size:.9rem;color:#B9C7DA}
.board-foot b{display:block;font-size:1.35rem;color:#fff;font-stretch:115%;font-weight:750}
@media (prefers-reduced-motion: reduce){.slot.pop{animation:none}}

/* ---------- Chips y estados ---------- */
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:.3rem .75rem;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chip b{color:var(--text);margin-left:.2rem}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on b{color:#fff}
.tag{display:inline-block;font-size:.75rem;font-weight:650;padding:.12rem .5rem;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.35rem;vertical-align:middle}
.t-ok{color:var(--ok)} .t-warn{color:var(--warn)} .t-bad{color:var(--bad)}
.bg-ok{background:var(--ok)} .bg-warn{background:var(--warn)} .bg-bad{background:var(--bad)}
.res{border-radius:var(--radius-s);padding:.3rem .4rem;font-size:.85rem;font-weight:600;border:1px solid var(--line-2);max-width:12rem}
.res-pendiente{background:var(--surface)}
.res-sin_respuesta{background:var(--surface-2);color:var(--muted)}
.res-seguimiento{background:var(--warn-soft);border-color:transparent}
.res-no_interesado{background:var(--bad-soft);border-color:transparent}
.res-cita_inicial{background:var(--accent-soft);border-color:transparent}
.res-cita_cierre{background:var(--ok-soft);border-color:transparent}

/* ---------- Tablas ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-size:.8rem;color:var(--muted);font-weight:650;padding:.55rem .6rem;border-bottom:1px solid var(--line)}
.tbl td{padding:.6rem;border-bottom:1px solid var(--line);vertical-align:middle}
table.cards td:first-child{min-width:15rem}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl .num{text-align:right}
.pname{font-weight:650}
.pmeta{font-size:.8rem;color:var(--muted);display:flex;gap:.6rem;flex-wrap:wrap;margin-top:2px}
.pmeta a{color:var(--muted)}
.notes{color:var(--muted);font-size:.85rem;max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:.2rem;justify-content:flex-end}
.minibar{display:flex;align-items:center;gap:.5rem}
.minibar .track{flex:1;min-width:70px;height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden;position:relative}
.minibar .track i{display:block;height:100%;background:var(--accent)}
.minibar .track .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:1.05rem;margin-bottom:.3rem}

/* ---------- Métricas y gráficas ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;margin-bottom:1.2rem}
.kpi{background:var(--surface);padding:1rem 1.1rem}
.kpi span{font-size:.85rem;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:1.7rem;font-stretch:115%;font-weight:780;margin-top:.1rem}
.kpi small{color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2rem}
.charts .panel{margin:0}
.chart-box{position:relative;height:260px}
.chart-box.tall{height:320px}

/* ---------- Biblioteca ---------- */
.lib-tools{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:.8rem;margin-bottom:1rem}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin-bottom:1.1rem;overflow-x:auto}
.tab{background:none;border:none;padding:.7rem .9rem;font-weight:650;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab b{font-weight:600;color:var(--muted);margin-left:.25rem}
.res-list{display:grid;gap:1rem}
.res-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:1.1rem 1.2rem}
.res-card header{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:.6rem}
.res-card .tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.35rem}
.script{white-space:pre-wrap;line-height:1.62;max-width:78ch;font-size:.97rem}
.script mark{background:var(--accent-soft);color:var(--accent-ink);border-radius:3px;padding:0 .15rem;font-weight:600}
.script .fill{background:transparent;color:inherit;font-weight:650;border-bottom:2px solid var(--accent)}
details.obj{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m)}
details.obj summary{cursor:pointer;padding:1rem 1.2rem;font-weight:680;display:flex;justify-content:space-between;gap:1rem;align-items:center;list-style:none}
details.obj summary::-webkit-details-marker{display:none}
details.obj summary::after{content:"+";font-size:1.3rem;color:var(--muted);font-weight:500}
details.obj[open] summary::after{content:"−"}
details.obj .body{padding:0 1.2rem 1.1rem}

/* ---------- Acceso ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr}
.auth-side{background:var(--ink);color:#fff;padding:clamp(2rem,5vw,4rem);display:flex;flex-direction:column;justify-content:space-between;gap:2rem}
.auth-side h1{font-size:clamp(2rem,4vw,3.1rem);font-stretch:122%;font-weight:800;max-width:14ch;color:#fff}
.auth-side p{color:#B9C7DA;max-width:42ch;margin-top:1rem;font-size:1.02rem}
.auth-side .slots{max-width:520px}
.auth-side .slot{height:44px}
.auth-main{display:flex;align-items:center;justify-content:center;padding:2rem}
.auth-card{width:100%;max-width:380px}
.auth-card h2{font-size:1.5rem;margin-bottom:.3rem}
.auth-card .sub{color:var(--muted);margin-bottom:1.4rem}
.auth-card form{display:grid;gap:.9rem}
.auth-card .btn.primary{justify-content:center;padding:.7rem}
.linkbtn{background:none;border:none;color:var(--accent-ink);cursor:pointer;padding:0;font-weight:600;text-decoration:underline}
.demo-note{background:var(--warn-soft);border-radius:var(--radius-s);padding:.8rem .9rem;font-size:.9rem;margin-bottom:1rem}
.banner-demo{background:var(--warn-soft);color:var(--text);font-size:.85rem;padding:.5rem 1rem;border-radius:var(--radius-s);margin-bottom:1rem}

/* ---------- Modal y avisos ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(4vh,env(safe-area-inset-top,0px)) 1rem 2rem;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--radius-l);width:100%;max-width:680px;padding:1.4rem;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:rise .18s ease-out}
.modal.wide{max-width:900px}
.modal header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:1rem}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.modal{animation:none}}
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:grid;gap:.5rem;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:#fff;padding:.7rem 1rem;border-radius:var(--radius-s);font-weight:560;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--bad)}
.loading{color:var(--muted);padding:2rem 0}
.row-flex{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mt{margin-top:1rem}
.pending-card{max-width:520px;margin:12vh auto;padding:2rem;text-align:left}

/* ---------- Responsivo ---------- */
@media (max-width: 1000px){
  .grid-form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .charts{grid-template-columns:1fr}
  .lib-tools{grid-template-columns:1fr 1fr}
}
@media (max-width: 760px){
  #app{grid-template-columns:minmax(0,1fr);background:none}
  .nav{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom,0px));z-index:40;justify-content:space-around}
  .nav .brand,.nav .sep,.nav .me{display:none}
  .auth-side .slots{flex-wrap:nowrap;gap:3px}
  .auth-side .slot{min-width:0;height:34px}
  .auth-side .slot-mark{height:34px}
  .nav a.item{flex-direction:column;gap:.15rem;font-size:.68rem;padding:.4rem .3rem;margin:0;flex:1;text-align:center}
  .nav a.item.active{box-shadow:inset 0 3px 0 var(--accent)}
  main{padding:1.1rem 1rem 6.5rem}
  .mobile-top{display:flex!important}
  .auth{grid-template-columns:1fr}
  .auth-side{padding:2rem 1.4rem}
  .grid-form{grid-template-columns:1fr}
  .grid-form .span2{grid-column:auto}
  .lib-tools{grid-template-columns:1fr}
  .weeknav{width:100%;justify-content:space-between}
  .weeknav .lbl{min-width:0}
  .slots{flex-wrap:nowrap;gap:3px}
  .slot{min-width:0;height:44px;font-size:.6rem;border-radius:5px}
  .slot-mark{height:44px}
  /* tabla de prospectos como tarjetas */
  table.cards thead{display:none}
  table.cards, table.cards tbody, table.cards tr, table.cards td{display:block;width:100%}
  table.cards tr{border:1px solid var(--line);border-radius:var(--radius-m);padding:.6rem .7rem;margin-bottom:.7rem;background:var(--surface)}
  table.cards td{border:none;padding:.25rem 0}
  table.cards td[data-l]::before{content:attr(data-l);display:block;font-size:.72rem;color:var(--muted);font-weight:600}
  table.cards .acts{justify-content:flex-start}
  .notes{max-width:none;white-space:normal}
}
@media (max-width: 760px){#toast{bottom:calc(5.2rem + env(safe-area-inset-bottom,0px))}}
.mobile-top{display:none;align-items:center;justify-content:space-between;margin-bottom:1rem}
.mobile-top .brand{display:flex;padding:0}
.mobile-top .brand b{color:var(--text)}
.mobile-top .brand small{color:var(--muted)}
</style>
</head>
<body>
<div id="auth" class="hidden"></div>
<div id="app" class="hidden">
  <nav class="nav" aria-label="Menú principal">
    <div class="brand"><span class="brand-mark"><i></i><i></i><i></i></span><div><b>Prospecta</b><small>Grupo Asesores RAM</small></div></div>
    <a href="#semana" class="item" data-view="semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3M8 17h6"/></svg><span>Mi semana</span></a>
    <a href="#desempeno" class="item" data-view="desempeno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Mi desempeño</span></a>

<script>
/* =====================================================================
   CONFIGURACIÓN
   API_URL: la URL de tu aplicación web de Apps Script (termina en /exec).
   Si la dejas vacía, la app abre en MODO DEMOSTRACIÓN con datos ficticios.
   ===================================================================== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycby3-ACBde-DUjgJUDbTRKkQz2k9TlHc4qvAlzpFMezXyS35gUUHzK7ST-dtwZhlC-jf/exec',

  // Privacidad: en false, la app NO pide ni guarda teléfonos de prospectos.
  // Cámbialo a true solo si tu equipo lo necesita y tu aviso de privacidad lo cubre.
  CAPTURAR_TELEFONO: false,
};
const TEL = !!CONFIG.CAPTURAR_TELEFONO;
const DEMO = !CONFIG.API_URL;
const APP_URL = location.origin + location.pathname;

/* ---------- Catálogos ---------- */
const RESULTADOS = {
  pendiente:     { label: 'Por contactar' },
  sin_respuesta: { label: 'No contestó' },
  seguimiento:   { label: 'Volver a contactar' },
  no_interesado: { label: 'No interesado' },
  cita_inicial:  { label: 'Cita inicial' },
  cita_cierre:   { label: 'Cita de cierre' },
};
const CANALES = { llamada:'Llamada', whatsapp:'WhatsApp', mensaje:'SMS / mensaje', redes:'Redes sociales', email:'Correo', presencial:'En persona' };
const ORIGENES = ['Referido','Mercado natural','Cliente actual','Redes sociales','Base de datos / frío','Evento','Centro de influencia','Otro'];
const PRODUCTOS = ['Por definir','Vida','Gastos médicos','PPR / retiro','Educación','Auto','Hogar','Mascotas','Empresarial'];
const CATEGORIAS = { llamada:'Guiones de llamada', mensaje:'Mensajes digitales', objecion:'Objeciones', tip:'Buenas prácticas' };

/* ---------- Utilidades ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA = ['dom','lun','mar','mié','jue','vie','sáb'];
function toKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fromKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function mondayOf(d = new Date()){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return toKey(x); }
function addWeeks(k, n){ const d = fromKey(k); d.setDate(d.getDate() + 7*n); return toKey(d); }
function weekEnd(k){ const d = fromKey(k); d.setDate(d.getDate()+6); return d; }
function fmtWeek(k){
  const a = fromKey(k), b = weekEnd(k);
  const left = a.getMonth() === b.getMonth() ? `${a.getDate()}` : `${a.getDate()} ${MES[a.getMonth()]}`;
  return `${left} al ${b.getDate()} ${MES[b.getMonth()]}`;
}
function fmtShort(k){ const d = fromKey(k); return `${d.getDate()} ${MES[d.getMonth()]}`; }
function fmtDT(iso){ if(!iso) return ''; const d = new Date(iso); return `${DIA[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function toLocalInput(iso){ if(!iso) return ''; const d = new Date(iso); return `${toKey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fromLocalInput(v){ return v ? new Date(v).toISOString() : null; }
function relTime(iso){
  if(!iso) return '—';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if(m < 1) return 'hace un momento'; if(m < 60) return `hace ${m} min`;
  const h = Math.round(m/60); if(h < 24) return `hace ${h} h`;
  const d = Math.round(h/24); return d === 1 ? 'ayer' : `hace ${d} días`;
}
function waLink(tel){ let d = String(tel||'').replace(/\D/g,''); if(d.length === 10) d = '52' + d; return d.length >= 11 ? `https://wa.me/${d}` : null; }
function telLink(tel){ const d = String(tel||'').replace(/[^\d+]/g,''); return d.length >= 7 ? `tel:${d}` : null; }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36)); }

function metricas(rows){
  const m = { total: rows.length, contactados: 0, ini: 0, cie: 0, realizadas: 0, pendientes: 0, porRes: {}, porCanal: {} };
  for(const r of rows){
    m.porRes[r.resultado] = (m.porRes[r.resultado] || 0) + 1;
    const c = (m.porCanal[r.canal] ||= { contactos: 0, citas: 0 });
    if(r.resultado === 'pendiente') m.pendientes++;
    else { m.contactados++; c.contactos++; }
    if(r.resultado === 'cita_inicial'){ m.ini++; c.citas++; }
    if(r.resultado === 'cita_cierre'){ m.cie++; c.citas++; }
    if((r.resultado === 'cita_inicial' || r.resultado === 'cita_cierre') && r.cita_realizada) m.realizadas++;
  }
  m.efect = m.contactados ? Math.round((m.ini + m.cie) / m.contactados * 100) : 0;
  return m;
}
function tono(valor, min){ if(valor >= min) return 'ok'; if(valor >= Math.max(1, Math.floor(min * 0.7))) return 'warn'; return 'bad'; }
const TONO_TXT = { ok: 'En meta', warn: 'Cerca', bad: 'Abajo' };
function estadoSemana(v, min, weekKey){
  if(v >= min) return { t: 'ok', txt: 'En meta' };
  if(weekKey === mondayOf()){
    const d = Math.min(4, (new Date().getDay() + 6) % 7), esperado = Math.ceil(min * (d + 1) / 5);
    return v >= esperado ? { t: 'warn', txt: 'Al ritmo' } : { t: 'bad', txt: 'Atrasado' };
  }
  const t = tono(v, min); return { t, txt: TONO_TXT[t] };
}
function metas(p){ return { iniMin: p?.meta_ini_min ?? 10, iniMax: p?.meta_ini_max ?? 15, cieMin: p?.meta_cie_min ?? 3, cieMax: p?.meta_cie_max ?? 5 }; }
function nombreCorto(n){ return String(n||'').split(/\s+/).slice(0,2).join(' '); }

/* =====================================================================
   CAPA DE DATOS — Google Apps Script + Google Sheets
   ===================================================================== */
function GasAPI(){
  const KEY = 'prospecta_gar_sesion';
  let token = null, alExpirar = null;
  try { token = localStorage.getItem(KEY); } catch {}
  const setToken = t => { token = t; try { t ? localStorage.setItem(KEY, t) : localStorage.removeItem(KEY); } catch {} };
  async function call(action, params = {}){
    let res, j;
    try {
      res = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token, ...params }) });
    } catch { throw new Error('No hay conexión con el servidor. Revisa tu internet e inténtalo de nuevo.'); }
    try { j = await res.json(); }
    catch { throw new Error('El servidor respondió algo inesperado. Revisa que API_URL sea la URL /exec de Apps Script y que la app web esté publicada para «Cualquier persona».'); }
    if(!j.ok){
      if(j.error === 'SESION_INVALIDA'){ setToken(null); alExpirar && alExpirar(); throw new Error('Tu sesión terminó. Vuelve a entrar con tu PIN.'); }
      throw new Error(j.error);
    }
    return j.data;
  }
  return {
    onExpired(cb){ alExpirar = cb; },
    async restore(){ if(!token) return null; try { return await call('me'); } catch { return null; } },
    async signIn(email, pin){ const d = await call('login', { email, pin }); setToken(d.token); return d.user; },
    async signOut(){ setToken(null); },
    async changePin(actual, nuevo){ const d = await call('cambiarPin', { actual, nuevo }); setToken(d.token); return d.user; },
    version: () => call('version'),
    listProfiles: () => call('listProfiles'),
    updateProfile: (id, patch) => call('updateProfile', { id, patch }),
    createUser: user => call('crearUsuario', { user }),
    async resetPin(id){ const d = await call('nuevoPin', { id }); if(d.token) setToken(d.token); return d; },
    listRegistros: q => call('listRegistros', q),
    addRegistros: rows => call('addRegistros', { rows }),
    updateRegistro: (id, patch) => call('updateRegistro', { id, patch }),
    deleteRegistro: id => call('deleteRegistro', { id }),
    listRecursos: () => call('listRecursos'),
    saveRecurso: recurso => call('saveRecurso', { recurso }),
    bulkRecursos: rows => call('bulkRecursos', { rows }),
    deleteRecurso: id => call('deleteRecurso', { id }),
  };
}

/* =====================================================================
   CAPA DE DATOS — Demostración (en memoria, datos ficticios)
   ===================================================================== */
function DemoAPI(){
  let seed = 20260928;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const M = { meta_ini_min: 10, meta_ini_max: 15, meta_cie_min: 3, meta_cie_max: 5 };
  const now = new Date().toISOString();
  const users = [
    { id: 'u-admin', email: 'admin@demo.gar', full_name: 'Administrador Demo', role: 'admin', active: true, ...M, created_at: now },
    { id: 'u-1', email: 'andrea@demo.gar', full_name: 'Andrea Salinas', role: 'agente', active: true, ...M, created_at: now, k: .95 },
    { id: 'u-2', email: 'carlos@demo.gar', full_name: 'Carlos Méndez', role: 'agente', active: true, ...M, created_at: now, k: .75 },
    { id: 'u-3', email: 'daniela@demo.gar', full_name: 'Daniela Ortiz', role: 'agente', active: true, ...M, created_at: now, k: .6 },
    { id: 'u-4', email: 'jorge@demo.gar', full_name: 'Jorge Ramírez', role: 'agente', active: true, ...M, created_at: now, k: .45 },
    { id: 'u-5', email: 'lucia@demo.gar', full_name: 'Lucía Herrera', role: 'agente', active: true, ...M, meta_ini_min: 8, meta_ini_max: 12, created_at: now, k: .7 },
    { id: 'u-6', email: 'roberto@demo.gar', full_name: 'Roberto Aguilar', role: 'agente', active: true, debe_cambiar: true, bloqueado: true, ...M, created_at: now },
  ];
  const NOM = ['Ana','Luis','María','José','Fernanda','Ricardo','Sofía','Miguel','Valeria','Alejandro','Paola','Eduardo','Gabriela','Héctor','Mariana','Óscar','Karla','Raúl','Claudia','Iván','Mónica','Arturo','Patricia','Sergio'];
  const APE = ['García','Hernández','López','Martínez','González','Pérez','Sánchez','Romero','Torres','Flores','Rivera','Gómez','Díaz','Cruz','Morales','Reyes','Jiménez','Ruiz','Vargas','Castillo'];
  const registros = [];
  const thisWeek = mondayOf();
  const dow = (new Date().getDay() + 6) % 7;
  for(const u of users.filter(u => u.role === 'agente' && u.active)){
    for(let w = -11; w <= 0; w++){
      const semana = addWeeks(thisWeek, w);
      const frac = w === 0 ? Math.max(.25, Math.min(1, (dow + 1) / 5)) : 1;
      const n = Math.round((24 + rnd() * 22) * (0.7 + u.k * 0.5) * frac);
      for(let i = 0; i < n; i++){
        const r = rnd(); let res;
        const pIni = .16 + u.k * .2, pCie = .05 + u.k * .07;
        if(w === 0 && rnd() < .35) res = 'pendiente';
        else if(r < pIni) res = 'cita_inicial';
        else if(r < pIni + pCie) res = 'cita_cierre';
        else res = pick(['sin_respuesta','sin_respuesta','seguimiento','no_interesado','seguimiento']);
        const d = fromKey(semana); d.setDate(d.getDate() + Math.floor(rnd() * 5)); d.setHours(9 + Math.floor(rnd() * 9), rnd() < .5 ? 0 : 30);
        const esCita = res.startsWith('cita');
        let created = fromKey(semana); created.setDate(created.getDate() + Math.floor(rnd() * 5)); created.setHours(9 + Math.floor(rnd() * 9));
        if(created > new Date()) created = new Date(Date.now() - Math.floor(rnd() * 5 + 1) * 3600000);
        registros.push({
          id: uid(), agente_id: u.id, semana, nombre: `${pick(NOM)} ${pick(APE)} ${pick(APE)}`,
          telefono: !TEL ? null : `44${Math.floor(rnd()*9)+1} ${String(Math.floor(rnd()*900)+100)} ${String(Math.floor(rnd()*9000)+1000)}`,
          canal: pick(['llamada','llamada','llamada','whatsapp','whatsapp','redes','presencial']),
          origen: pick(ORIGENES), producto: pick(PRODUCTOS.slice(1)), resultado: res,
          fecha_cita: esCita ? d.toISOString() : null, cita_realizada: esCita && w < 0 && rnd() < .8,
          notas: rnd() < .3 ? pick(['Prefiere después de las 6 pm','Le interesa proteger a sus hijos','Tiene seguro del trabajo','Pidió propuesta para retiro','Referido de cliente actual']) : '',
          created_at: created.toISOString(), updated_at: created.toISOString(),
        });
      }
    }
  }
  let recursos = RECURSOS_BASE.map((r, i) => ({ id: uid(), ...r, orden: r.orden ?? (i + 1) * 10, created_at: now, updated_at: now }));
  let session = null, version = 1;
  const cl = o => JSON.parse(JSON.stringify(o));
  const emit = () => { version++; };
  const me = () => users.find(u => u.id === session?.user?.id);
  const pinDemo = () => String(Math.floor(100000 + Math.random() * 899999));
  return {
    demoUsers: users,
    onExpired(){},
    async restore(){ return null; },
    async signInAs(id){ const u = users.find(x => x.id === id); session = { user: { id: u.id } }; return cl(u); },
    async signIn(){ throw new Error('En la demostración usa los botones de acceso rápido.'); },
    async signOut(){ session = null; },
    async changePin(actual, nuevo){ const u = me(); u.debe_cambiar = false; return cl(u); },
    async version(){ return version; },
    async listProfiles(){ return cl(users).sort((a, b) => a.full_name.localeCompare(b.full_name)); },
    async updateProfile(id, patch){ const u = users.find(x => x.id === id); Object.assign(u, patch); emit(); return cl(u); },
    async createUser(d){
      if(users.some(u => u.email === String(d.email).toLowerCase())) throw new Error('Ya existe un usuario con ese correo.');
      const u = { id: uid(), email: String(d.email).toLowerCase(), full_name: d.full_name, role: d.role || 'agente', active: true, debe_cambiar: true, ...M, created_at: new Date().toISOString() };
      users.push(u); emit(); return { user: cl(u), pin: pinDemo() };
    },
    async resetPin(id){ const u = users.find(x => x.id === id); u.debe_cambiar = true; u.bloqueado = false; return { pin: pinDemo() }; },
    async listRegistros({ agenteId, desde, hasta }){
      const yo = me(); const soloMios = yo.role !== 'admin';
      return cl(registros.filter(r => r.semana >= desde && r.semana <= hasta && (!agenteId || r.agente_id === agenteId) && (!soloMios || r.agente_id === yo.id)));
    },
    async addRegistros(rows){
      const t = new Date().toISOString();
      const out = rows.map(r => ({ id: uid(), agente_id: me().id, canal: 'llamada', resultado: 'pendiente', cita_realizada: false, fecha_cita: null, notas: '', created_at: t, updated_at: t, ...r }));
      registros.push(...out); emit(); return cl(out);
    },
    async updateRegistro(id, patch){ const r = registros.find(x => x.id === id); Object.assign(r, patch, { updated_at: new Date().toISOString() }); emit(); return cl(r); },
    async deleteRegistro(id){ const i = registros.findIndex(x => x.id === id); if(i > -1) registros.splice(i, 1); emit(); },
    async listRecursos(){ return cl(recursos).sort((a, b) => a.categoria.localeCompare(b.categoria) || a.orden - b.orden); },
    async saveRecurso(r){
      if(r.id){ const x = recursos.find(y => y.id === r.id); Object.assign(x, r); return cl(x); }
      const n = { ...r, id: uid(), created_at: now }; recursos.push(n); return cl(n);
    },
    async bulkRecursos(rows){ const n = rows.map(r => ({ ...r, id: uid() })); recursos.push(...n); return cl(n); },
    async deleteRecurso(id){ recursos = recursos.filter(r => r.id !== id); },
  };
}

/* =====================================================================
   APLICACIÓN
   ===================================================================== */
let API;
const S = {
  me: null, view: 'semana',
  week: mondayOf(), rows: [], filtro: 'todos', lastIni: null,
  perf: { agente: null, rango: 8 },
  teamWeek: mondayOf(), profiles: [],
  recursos: null, bibCat: 'llamada', bibQ: '', bibNombre: '', bibRef: '', bibYo: '',
  charts: {}, poll: null, ver: null, rtTimer: null, locked: false,
};
const isAdmin = () => S.me?.role === 'admin';

/* ---------- Avisos y modales ---------- */
function toast(msg, err = false){
  if([...$('#toast').children].some(x => x.textContent === msg)) return;   // evita avisos repetidos
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), err ? 5200 : 2800);
}
function errMsg(e){ return String(e?.message || e || 'Ocurrió un error. Intenta de nuevo.'); }
function openModal(html, wide = false, locked = false){
  closeModal(true);
  S.locked = locked;
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener('mousedown', e => { if(e.target === bg) closeModal(); });
  $('#modal-root').appendChild(bg);
  const f = bg.querySelector('[autofocus], input, select, textarea, button'); f && f.focus();
  return bg.firstElementChild;
}
function closeModal(force = false){ if(S.locked && !force) return; S.locked = false; $('#modal-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
async function conBoton(btn, textoEspera, fn){
  const txt = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = textoEspera; }
  try { return await fn(); } finally { if(btn && document.body.contains(btn)){ btn.disabled = false; btn.textContent = txt; } }
}
const PIN_ATTRS = 'type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" required';
function pinDebil(pin){
  if(/^(\d)\1{5}$/.test(pin)) return true;
  const d = pin.split('').map(Number);
  return d.every((v, i) => i === 0 || v === (d[i - 1] + 1) % 10) || d.every((v, i) => i === 0 || v === (d[i - 1] + 9) % 10);
}

function killCharts(){ Object.values(S.charts).forEach(c => c.destroy()); S.charts = {}; }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ---------- Arranque y sesión ---------- */
async function boot(){
  API = DEMO ? DemoAPI() : GasAPI();
  API.onExpired(() => { if(S.me){ salir(); toast('Tu sesión terminó. Vuelve a entrar con tu PIN.', true); } });
  if(!DEMO){ $('#auth').className = 'auth'; $('#auth').innerHTML = `<div class="pending-card muted">Cargando…</div>`; }
  const me = await API.restore();
  me ? entrar(me) : renderAuth();
}
function entrar(me){
  S.me = me; S.perf.agente = me.id; S.bibYo = nombreCorto(me.full_name); S.recursos = null; S.profiles = [];
  showApp();
  if(me.debe_cambiar) modalPin(true);
  iniciarSondeo();
}
function salir(){
  API.signOut(); S.me = null; S.recursos = null; S.profiles = [];
  clearInterval(S.poll); S.poll = null; S.ver = null;
  killCharts(); closeModal(true); renderAuth();
}

/* Actualización automática: consulta cada 30 s si hubo cambios en la base */
function iniciarSondeo(){
  clearInterval(S.poll); S.ver = null;
  const revisar = async () => {
    if(document.hidden || !S.me) return;
    try { const v = String(await API.version()); if(S.ver !== null && v !== S.ver) onRealtime(); S.ver = v; } catch {}
  };
  revisar(); S.poll = setInterval(revisar, 30000);
}
document.addEventListener('visibilitychange', () => { if(!document.hidden && S.me && S.ver !== null) API.version().then(v => { if(String(v) !== S.ver){ S.ver = String(v); onRealtime(); } }).catch(() => {}); });

function onRealtime(){
  clearTimeout(S.rtTimer);
  S.rtTimer = setTimeout(() => {
    if($('.modal-bg')) return;              // no interrumpir si hay un formulario abierto
    if(S.view === 'semana') loadSemana(true);
    else if(S.view === 'equipo') renderEquipo(true);
    else if(S.view === 'desempeno') renderDesempeno(true);

function tallyRow(titulo, valor, min, max, animarDesde){
  const n = Math.max(max, valor), t = tono(valor, min);
  let slots = '';
  for(let i = 1; i <= n; i++){
    const fill = i <= valor, extra = i > min;
    const pop = fill && animarDesde != null && i > animarDesde ? ' pop' : '';
    slots += `<span class="slot${extra ? ' stretch' : ''}${fill ? ' fill' : ''}${fill && i > max ? ' extra' : ''}${pop}">${i}</span>`;
    if(i === min && n > min) slots += '<span class="slot-mark">mínimo</span>';
  }
  let nota;
  if(valor >= max) nota = `<b class="ok">Meta completa.</b> Llegaste al tope de ${max}; todo lo que sumes es extra.`;
  else if(valor >= min) nota = `<b class="ok">Meta mínima cumplida.</b> Te ${max - valor === 1 ? 'falta 1' : `faltan ${max - valor}`} para el tope de ${max}.`;
  else nota = `<b class="${t}">Te ${min - valor === 1 ? 'falta 1' : `faltan ${min - valor}`}</b> para la meta mínima de ${min}.`;
  if(S.week === mondayOf() && valor < min){
    const d = (new Date().getDay() + 6) % 7;
    if(d < 5){ const esperado = Math.ceil(min * (d + 1) / 5); nota += valor >= esperado ? ' Vas al ritmo.' : ` Para ir al ritmo, hoy deberías llevar ${esperado}.`; }
  }
  return `<div class="tally-row">
    <div class="tally-head"><h2>${titulo}</h2><span class="tally-count" aria-label="${valor} de ${min} a ${max}"><b>${valor}</b>de ${min} a ${max}</span></div>
    <div class="slots">${slots}</div>
    <p class="tally-note">${nota}</p>
  </div>`;
}

function paintSemana(){

  const lista = S.filtro === 'todos' ? S.rows : S.rows.filter(r => r.resultado === S.filtro);
  const orden = { pendiente: 0, seguimiento: 1, sin_respuesta: 2, cita_inicial: 3, cita_cierre: 4, no_interesado: 5 };

  </header>

  <section class="board" aria-label="Avance de citas de la semana">
    ${tallyRow('Citas iniciales', m.ini, mt.iniMin, mt.iniMax, prev ? prev.ini : null)}
    ${tallyRow('Citas de cierre', m.cie, mt.cieMin, mt.cieMax, prev ? prev.cie : null)}
    <div class="board-foot">
      <div><b>${m.contactados}</b>contactos hechos</div>
      <div><b>${m.pendientes}</b>por contactar</div>

    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><div><h2>Agregar prospecto</h2><p>Registra el contacto y su resultado. Si aún no lo contactas, déjalo en «Por contactar».${TEL ? '' : ' Por privacidad, aquí no se guardan teléfonos: úsalos desde tus contactos.'}</p></div>
      <button class="btn sm" data-action="bulk-open">Pegar una lista de nombres</button></div>
    ${formProspecto({ ...(S.lastAdd || {}) }, 'add')}
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Prospectos de la semana</h2>
      ${S.rows.length ? `<button class="btn sm" data-action="export-mine">Descargar CSV</button>` : ''}</div>
    <div class="chips" style="margin-bottom:1rem">${filtros.map(([k, l, n]) => `<button class="chip${S.filtro === k ? ' on' : ''}" data-action="filtro" data-f="${k}">${l}<b>${n}</b></button>`).join('')}</div>
    ${lista.length ? `<div class="tbl-wrap"><table class="tbl cards">
      <thead><tr><th>Prospecto</th><th>Canal</th><th>Resultado</th><th>Cita</th><th>Notas</th><th><span class="sr">Acciones</span></th></tr></thead>
      <tbody>${lista.map(r => filaProspecto(r, lblDestino, destino)).join('')}</tbody></table></div>`
    : `<div class="empty"><b>${S.rows.length ? 'Nada con este filtro' : 'Tu lista de esta semana está vacía'}</b>${S.rows.length ? 'Prueba con otro resultado.' : 'Agrega tu primer prospecto arriba o pega tu lista completa de nombres.'}</div>`}
  </section>`;
}

const FILTRO_LBL = { pendiente:'Por contactar', sin_respuesta:'No contestó', seguimiento:'Volver a contactar', no_interesado:'No interesado', cita_inicial:'Citas iniciales', cita_cierre:'Citas de cierre' };

function filaProspecto(r, lblDestino, destino){

    <td data-l="Notas"><div class="notes" title="${esc(r.notas)}">${esc(r.notas) || '<span class="muted">—</span>'}</div></td>
    <td><div class="acts">
      ${movible ? `<button class="btn ghost sm" data-action="mover" data-id="${r.id}" data-to="${destino}" title="Crea una copia en «Por contactar» en la semana ${fmtWeek(destino)} para no perder el seguimiento">${lblDestino}</button>` : ''}
      <button class="btn ghost sm" data-action="edit" data-id="${r.id}">Editar</button>

function leerForm(form){
  const fd = new FormData(form); const o = {};
  for(const [k, v] of fd.entries()) o[k] = typeof v === 'string' ? v.trim() : v;
  return o;
}
function datosProspecto(form){
  const o = leerForm(form);
  const d = { nombre: o.nombre, telefono: TEL ? (o.telefono || null) : null, canal: o.canal, resultado: o.resultado, origen: o.origen, producto: o.producto, notas: o.notas || null, fecha_cita: fromLocalInput(o.fecha_cita) };
  if(form.querySelector('[name=cita_realizada]')) d.cita_realizada = !!o.cita_realizada;
  if(!d.resultado.startsWith('cita')){ d.fecha_cita = null; d.cita_realizada = false; }
  return d;
}

async function ensureProfiles(force = false){ if(isAdmin() && (force || !S.profiles.length)) S.profiles = await API.listProfiles(); }

async function renderDesempeno(silent = false){
  const main = $('#main');
  if(!silent) main.innerHTML = `${mobileTop()}${demoBanner()}<p class="loading">Calculando tu desempeño…</p>`;
  try {
    await ensureProfiles();
    const agente = isAdmin() ? (S.perf.agente || S.me.id) : S.me.id;
    const perfil = agente === S.me.id ? S.me : S.profiles.find(p => p.id === agente) || S.me;
    const mt = metas(perfil), N = S.perf.rango;
    const hasta = mondayOf(), desde = addWeeks(hasta, -(N - 1));
    const rows = await API.listRegistros({ agenteId: agente, desde, hasta });

    const porSem = semanas.map(k => ({ k, ...metricas(rows.filter(r => r.semana === k)) }));

    const prom = k => cerradas.length ? (cerradas.reduce((a, s) => a + s[k], 0) / cerradas.length).toFixed(1) : '0';
    const agentes = S.profiles.filter(p => p.active);

    killCharts();
    main.innerHTML = `${mobileTop()}${demoBanner()}
    <header class="page-head">
      <div><h1>${agente === S.me.id ? 'Mi desempeño' : `Desempeño de ${esc(nombreCorto(perfil.full_name))}`}</h1>

      </div>
    </header>
    <div class="kpis">
      <div class="kpi"><span>Semanas en meta de citas iniciales</span><b>${cumpleIni} de ${cerradas.length}</b><small>Meta: ${mt.iniMin} a ${mt.iniMax} por semana</small></div>
      <div class="kpi"><span>Semanas en meta de cierre</span><b>${cumpleCie} de ${cerradas.length}</b><small>Meta: ${mt.cieMin} a ${mt.cieMax} por semana</small></div>
      <div class="kpi"><span>Promedio semanal</span><b>${prom('ini')} <small>iniciales</small></b><small>${prom('cie')} de cierre, ${prom('contactados')} contactos</small></div>
      <div class="kpi"><span>Racha en meta completa</span><b>${racha} ${racha === 1 ? 'semana' : 'semanas'}</b><small>${tot.efect}% de contactos terminan en cita</small></div>
    </div>
    <div class="charts">
      <section class="panel"><div class="panel-head"><h2>Citas iniciales por semana</h2></div><div class="chart-box"><canvas id="ch-ini" role="img" aria-label="Citas iniciales por semana contra la meta"></canvas></div></section>
      <section class="panel"><div class="panel-head"><h2>Citas de cierre por semana</h2></div><div class="chart-box"><canvas id="ch-cie" role="img" aria-label="Citas de cierre por semana contra la meta"></canvas></div></section>

    </div>

        return `<tr><td>${fmtWeek(s.k)}${i === 0 ? ' <span class="tag">en curso</span>' : ''}</td><td class="num">${s.contactados}</td><td class="num">${s.ini}</td><td class="num">${s.cie}</td><td class="num">${s.efect}%</td><td><span class="dot bg-${t}"></span>${i === 0 && t !== 'ok' ? 'En progreso' : TONO_TXT[t]}</td></tr>`; }).join('')}</tbody></table></div>

function chartBase(){
  const text = cssVar('--muted'), grid = cssVar('--line');
  Chart.defaults.font.family = cssVar('--font') || 'system-ui';
  Chart.defaults.color = text;
  return {
    responsive: true, maintainAspectRatio: false, animation: { duration: 450 },
    plugins: { legend: { labels: { boxWidth: 12, boxHeight: 12, usePointStyle: true } }, tooltip: { backgroundColor: cssVar('--ink'), padding: 10 } },
    scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: grid }, ticks: { precision: 0 } } },
  };
}
function metaLine(label, val, n, color){ return { type: 'line', label, data: Array(n).fill(val), borderColor: color, borderDash: [6, 5], borderWidth: 2, pointRadius: 0, fill: false, order: 0 }; }

function drawPerfCharts(porSem, tot, mt){
  if(typeof Chart === 'undefined') return;
  const labels = porSem.map(s => fmtShort(s.k)), n = labels.length;
  const accent = cssVar('--accent'), ok = cssVar('--ok'), ink = cssVar('--text'), warn = cssVar('--warn'), bad = cssVar('--bad'), muted = cssVar('--muted'), line2 = cssVar('--line-2');
  const colorPor = (v, min) => v >= min ? accent : v >= Math.max(1, Math.floor(min * .7)) ? warn : bad;
  const enCurso = (arr) => arr.map((c, i) => i === n - 1 && /^#[0-9a-f]{6}$/i.test(c) ? c + '70' : c);
  const base = chartBase();
  S.charts.ini = new Chart($('#ch-ini'), { type: 'bar', options: base, data: { labels, datasets: [
    { label: 'Citas iniciales', data: porSem.map(s => s.ini), backgroundColor: enCurso(porSem.map(s => colorPor(s.ini, mt.iniMin))), borderRadius: 4, order: 1 },
    metaLine('Meta mínima', mt.iniMin, n, ink), metaLine('Tope', mt.iniMax, n, muted) ] } });
  S.charts.cie = new Chart($('#ch-cie'), { type: 'bar', options: base, data: { labels, datasets: [
    { label: 'Citas de cierre', data: porSem.map(s => s.cie), backgroundColor: enCurso(porSem.map(s => s.cie >= mt.cieMin ? ok : colorPor(s.cie, mt.cieMin))), borderRadius: 4, order: 1 },
    metaLine('Meta mínima', mt.cieMin, n, ink), metaLine('Tope', mt.cieMax, n, muted) ] } });
  S.charts.con = new Chart($('#ch-con'), { type: 'bar', data: { labels, datasets: [
    { label: 'Contactos hechos', data: porSem.map(s => s.contactados), backgroundColor: line2, borderRadius: 4, yAxisID: 'y', order: 2 },
    { type: 'line', label: '% que termina en cita', data: porSem.map(s => s.efect), borderColor: accent, backgroundColor: accent, cubicInterpolationMode: 'monotone', yAxisID: 'y2', order: 1 } ] },
    options: { ...base, scales: { ...base.scales, y2: { position: 'right', beginAtZero: true, max: 100, grid: { display: false }, ticks: { callback: v => v + '%' } } } } });
  const resKeys = Object.keys(RESULTADOS).filter(k => tot.porRes[k]);
  const resColor = { pendiente: line2, sin_respuesta: muted, seguimiento: warn, no_interesado: bad, cita_inicial: accent, cita_cierre: ok };
  S.charts.res = new Chart($('#ch-res'), { type: 'doughnut', data: { labels: resKeys.map(k => FILTRO_LBL[k]), datasets: [{ data: resKeys.map(k => tot.porRes[k]), backgroundColor: resKeys.map(k => resColor[k]), borderWidth: 2, borderColor: cssVar('--surface') }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'right', labels: { usePointStyle: true, boxWidth: 10 } } } } });
  const canales = Object.entries(tot.porCanal).filter(([, v]) => v.contactos).sort((a, b) => b[1].contactos - a[1].contactos);
  S.charts.can = new Chart($('#ch-can'), { type: 'bar', data: { labels: canales.map(([k]) => CANALES[k] || k), datasets: [
    { label: '% que termina en cita', data: canales.map(([, v]) => Math.round(v.citas / v.contactos * 100)), backgroundColor: accent, borderRadius: 4 } ] },
    options: { ...base, indexAxis: 'y', plugins: { ...base.plugins, legend: { display: false }, tooltip: { ...base.plugins.tooltip, callbacks: { label: c => { const v = canales[c.dataIndex][1]; return ` ${c.raw}% (${v.citas} citas de ${v.contactos} contactos)`; } } } },
      scales: { x: { beginAtZero: true, max: 100, grid: { color: cssVar('--line') }, ticks: { callback: v => v + '%' } }, y: { grid: { display: false } } } } });
}

function miniBar(v, min, max, e){
  const pct = Math.min(100, v / Math.max(1, max) * 100), mk = min / Math.max(1, max) * 100;
  return `<div class="minibar"><b style="min-width:1.6rem">${v}</b><span class="track"><i style="width:${pct}%;background:var(--${e.t === 'ok' ? 'accent' : e.t})"></i><span class="mk" style="left:${mk}%"></span></span><span class="small t-${e.t}" style="min-width:4.2rem">${e.txt}</span></div>`;
}
function drawTeamCharts(filas, rows, equipo, desde){
  if(typeof Chart === 'undefined') return;
  const base = chartBase(), accent = cssVar('--accent'), ok = cssVar('--ok'), ink = cssVar('--text');
  S.charts.team = new Chart($('#ch-team'), { type: 'bar', options: { ...base, indexAxis: 'y', scales: { x: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: cssVar('--line') } }, y: { grid: { display: false } } } },
    data: { labels: filas.map(f => nombreCorto(f.p.full_name)), datasets: [
      { label: 'Iniciales', data: filas.map(f => f.m.ini), backgroundColor: accent, borderRadius: 3 },
      { label: 'Cierre', data: filas.map(f => f.m.cie), backgroundColor: ok, borderRadius: 3 } ] } });
  const semanas = Array.from({ length: 8 }, (_, i) => addWeeks(desde, i));
  const ids = new Set(equipo.map(p => p.id));
  const pts = semanas.map(k => {
    const r = rows.filter(x => x.semana === k && ids.has(x.agente_id)), m = metricas(r);
    const enMeta = equipo.filter(p => metricas(r.filter(x => x.agente_id === p.id)).ini >= metas(p).iniMin).length;
    return { m, pct: equipo.length ? Math.round(enMeta / equipo.length * 100) : 0 };
  });
  S.charts.trend = new Chart($('#ch-trend'), { type: 'bar', data: { labels: semanas.map(fmtShort), datasets: [
    { label: 'Citas iniciales', data: pts.map(p => p.m.ini), backgroundColor: accent, borderRadius: 3, stack: 's', yAxisID: 'y', order: 2 },
    { label: 'Citas de cierre', data: pts.map(p => p.m.cie), backgroundColor: ok, borderRadius: 3, stack: 's', yAxisID: 'y', order: 2 },
    { type: 'line', label: '% de agentes en meta (semanas cerradas)', data: pts.map((p, i) => i === pts.length - 1 && semanas[i] === mondayOf() ? null : p.pct), borderColor: ink, backgroundColor: ink, cubicInterpolationMode: 'monotone', yAxisID: 'y2', order: 1 } ] },
    options: { ...base, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, grid: { color: cssVar('--line') } }, y2: { position: 'right', beginAtZero: true, max: 100, grid: { display: false }, ticks: { callback: v => v + '%' } } } } });
}

function paintBibBody(){
  const box = $('#bib-body'); if(!box) return;
  const abiertos = new Set($$('details.obj[open]', box).map(d => d.dataset.id));
  const q = S.bibQ.toLowerCase();
  const match = r => !q || (r.titulo + ' ' + r.contenido + ' ' + (r.etiquetas || '')).toLowerCase().includes(q);
  const cuenta = k => S.recursos.filter(r => r.categoria === k && match(r)).length;
  const lista = S.recursos.filter(r => r.categoria === S.bibCat && match(r)).sort((a, b) => a.orden - b.orden);
  const tags = r => (r.etiquetas || '').split(',').map(t => t.trim()).filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const adminBtns = r => isAdmin() ? `<button class="btn ghost sm" data-action="res-edit" data-id="${r.id}">Editar</button><button class="btn ghost sm danger" data-action="res-del" data-id="${r.id}">Eliminar</button>` : '';
  const card = r => r.categoria === 'objecion'
    ? `<details class="obj" data-id="${r.id}"${abiertos.has(r.id) ? ' open' : ''}><summary><span>${esc(r.titulo)}</span></summary><div class="body"><div class="tags" style="margin-bottom:.6rem">${tags(r)}</div><div class="script">${personaliza(r.contenido)}</div>
        <div class="row-flex mt"><button class="btn sm" data-action="copiar" data-id="${r.id}">Copiar respuesta</button>${adminBtns(r)}</div></div></details>`
    : `<article class="res-card"><header><div><h3>${esc(r.titulo)}</h3><div class="tags">${tags(r)}</div></div>
        <div class="row-flex" style="gap:.2rem"><button class="btn sm" data-action="copiar" data-id="${r.id}">Copiar</button>${adminBtns(r)}</div></header>
        <div class="script">${personaliza(r.contenido)}</div></article>`;
  box.innerHTML = `<div class="tabs" role="tablist">${Object.entries(CATEGORIAS).map(([k, l]) => `<button class="tab${S.bibCat === k ? ' on' : ''}" role="tab" aria-selected="${S.bibCat === k}" data-action="bib-cat" data-c="${k}">${l}<b>${cuenta(k)}</b></button>`).join('')}</div>

function descargarCSV(nombre, rows, nombres = {}){
  const cols = ['Semana','Agente','Prospecto', ...(TEL ? ['Teléfono'] : []),'Canal','Origen','Producto','Resultado','Fecha de cita','Cita realizada','Notas'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lineas = rows.map(r => [r.semana, nombres[r.agente_id] || S.me.full_name, r.nombre, ...(TEL ? [r.telefono] : []), CANALES[r.canal] || r.canal, r.origen, r.producto, FILTRO_LBL[r.resultado], r.fecha_cita ? fmtDT(r.fecha_cita) : '', r.cita_realizada ? 'Sí' : 'No', r.notas].map(q).join(','));
  const blob = new Blob(['\ufeff' + [cols.map(q).join(','), ...lineas].join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function copiarTexto(t){
  try { await navigator.clipboard.writeText(t); }
  catch { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
}

async function cargarXLSX(){
  if(window.XLSX) return;
  await new Promise((ok, fail) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; sc.onload = ok; sc.onerror = () => fail(new Error('No se pudo cargar el generador de Excel. Revisa tu conexión.')); document.head.appendChild(sc); });
}
async function descargarRespaldo(btn){
  btn.disabled = true; const txt = btn.textContent; btn.textContent = 'Preparando respaldo…';
  try {
    await cargarXLSX();
    const [perfiles, registros, recursos] = await Promise.all([API.listProfiles(), API.listRegistros({ desde: '2000-01-03', hasta: '2100-01-04' }), API.listRecursos()]);
    const nombres = Object.fromEntries(perfiles.map(p => [p.id, p.full_name]));
    const hReg = registros.map(r => ({ Semana: r.semana, Agente: nombres[r.agente_id] || '', Prospecto: r.nombre, ...(TEL ? { 'Teléfono': r.telefono || '' } : {}), Canal: CANALES[r.canal] || r.canal, Origen: r.origen || '', Producto: r.producto || '', Resultado: FILTRO_LBL[r.resultado] || r.resultado, 'Fecha de cita': r.fecha_cita ? fmtDT(r.fecha_cita) : '', 'Cita realizada': r.cita_realizada ? 'Sí' : 'No', Notas: r.notas || '', Creado: r.created_at, Actualizado: r.updated_at, id: r.id, agente_id: r.agente_id }));
    const hPer = perfiles.map(p => ({ Nombre: p.full_name, Correo: p.email, Rol: p.role, Activo: p.active ? 'Sí' : 'No', 'Iniciales mín': p.meta_ini_min, 'Iniciales tope': p.meta_ini_max, 'Cierre mín': p.meta_cie_min, 'Cierre tope': p.meta_cie_max, Alta: p.created_at, id: p.id }));
    const hRec = recursos.map(r => ({ 'Sección': CATEGORIAS[r.categoria] || r.categoria, 'Título': r.titulo, Etiquetas: r.etiquetas || '', Orden: r.orden, Contenido: r.contenido, id: r.id }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hReg.length ? hReg : [{ Semana: '' }]), 'Registros');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hPer), 'Agentes');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hRec.length ? hRec : [{ 'Sección': '' }]), 'Biblioteca');
    XLSX.writeFile(wb, `respaldo_prospecta_${toKey(new Date())}.xlsx`);
    toast(`Respaldo descargado: ${registros.length} registros`);
  } catch(e){ toast(errMsg(e), true); }
  btn.disabled = false; btn.textContent = txt;
}

document.addEventListener('change', async e => {
  const el = e.target.closest('[data-change]'); if(!el) return;
  const k = el.dataset.change;
  if(k === 'resultado' || k === 'realizada'){
    const r = S.rows.find(x => x.id === el.dataset.id); if(!r) return;
    const patch = k === 'resultado' ? { resultado: el.value } : { cita_realizada: el.checked };
    if(k === 'resultado' && !el.value.startsWith('cita')){ patch.fecha_cita = null; patch.cita_realizada = false; }
    try {
      Object.assign(r, await API.updateRegistro(r.id, patch)); paintSemana();

    } catch(err){ toast(errMsg(err), true); paintSemana(); }
  }
  if(k === 'perf-agente'){ S.perf.agente = el.value; renderDesempeno(); }
  if(k === 'perf-rango'){ S.perf.rango = Number(el.value); renderDesempeno(); }
});

document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-form]'); if(!form) return;
  e.preventDefault();
  const btn = form.querySelector('[type=submit]'); if(btn) btn.disabled = true;
  const o = leerForm(form);
  try {
    switch(form.dataset.form){
      case 'login': {
        const me = await API.signIn(o.email, o.pin);
        entrar(me); return;
      }
      case 'cambiar-pin': {
        if(o.nuevo !== o.nuevo2){ toast('Los dos PIN nuevos no coinciden.', true); break; }
        if(!/^\d{6}$/.test(o.nuevo)){ toast('El PIN debe tener 6 dígitos.', true); break; }
        if(pinDebil(o.nuevo)){ toast('Ese PIN es muy fácil de adivinar. Evita números repetidos o seguidos.', true); break; }
        const me = await API.changePin(o.actual, o.nuevo);
        S.me = { ...S.me, ...me }; closeModal(true); toast('PIN actualizado'); return;
      }
      case 'crear-usuario': {
        const d = await API.createUser({ full_name: o.full_name, email: o.email, role: o.role });
        form.reset(); modalPinGenerado(d.user, d.pin, true);
        if(S.view === 'usuarios') renderUsuarios();
        break;
      }
      case 'add-prospecto': {
        const d = datosProspecto(form);
        const [nuevo] = await API.addRegistros([{ ...d, semana: S.week }]);
        S.rows.push(nuevo); S.lastAdd = { canal: d.canal, origen: d.origen, producto: d.producto };
        paintSemana(); toast(d.resultado.startsWith('cita') ? '¡Cita registrada!' : 'Prospecto agregado');
        $('#semana-root [name=nombre]')?.focus();
        return;
      }
      case 'edit-prospecto': {
        const upd = await API.updateRegistro(form.dataset.id, datosProspecto(form));
        const i = S.rows.findIndex(x => x.id === upd.id); if(i > -1) S.rows[i] = upd;
        closeModal(); paintSemana(); toast('Cambios guardados'); return;
      }
      case 'bulk': {
        const filas = String(o.lista).split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
          const [nombre, ...resto] = TEL ? l.split(',') : [l]; return { nombre: nombre.trim(), telefono: TEL ? (resto.join(',').trim() || null) : null, canal: o.canal, origen: o.origen, producto: 'Por definir', resultado: 'pendiente', semana: S.week };
        }).filter(f => f.nombre);
        if(!filas.length) break;
        const nuevos = await API.addRegistros(filas); S.rows.push(...nuevos);
        closeModal(); paintSemana(); toast(`${nuevos.length} prospectos agregados`); return;
      }
      case 'metas-todos': {
        const m = { meta_ini_min: +o.meta_ini_min, meta_ini_max: +o.meta_ini_max, meta_cie_min: +o.meta_cie_min, meta_cie_max: +o.meta_cie_max };
        if(m.meta_ini_min > m.meta_ini_max || m.meta_cie_min > m.meta_cie_max){ toast('El mínimo no puede ser mayor que el tope.', true); break; }
        if(!confirm('¿Aplicar estas metas a todos los agentes?')) break;
        await Promise.all(S.profiles.filter(p => p.role === 'agente').map(p => API.updateProfile(p.id, m)));
        toast('Metas aplicadas al equipo'); renderUsuarios(); return;
      }
      case 'recurso': {
        const r = { categoria: o.categoria, titulo: o.titulo, contenido: String(form.contenido.value).trim(), etiquetas: o.etiquetas || null, orden: Number(o.orden) || 100 };

        closeModal(); paintBiblioteca(); toast(r.id ? 'Cambios guardados' : 'Recurso creado'); return;
      }
    }
  } catch(err){ toast(errMsg(err), true); }
  if(btn && document.body.contains(btn)) btn.disabled = false;
});

/* ---------- BUENAS PRÁCTICAS ---------- */
{ categoria: 'tip', titulo: 'La estructura de toda llamada para agendar', etiquetas: 'Método', orden: 10, contenido:
`1. Saludo y permiso: nombre, agencia y «¿le agarro en buen momento?».
2. Motivo: quién te recomendó o por qué le llamas a él.
3. Beneficio en una frase: qué gana con la cita (no qué producto vendes).
4. Cierre con dos opciones de día y hora.
5. Confirmación por WhatsApp inmediatamente después.

Recuerda: por teléfono vendes la cita, no el seguro. Si te piden detalles, la respuesta es «eso lo vemos en la cita, a su medida».` },

{ categoria: 'tip', titulo: 'Bloques de prospección', etiquetas: 'Hábitos', orden: 20, contenido:

• Registra el resultado de cada contacto en «Mi semana» al terminar cada llamada, no al final del día.
